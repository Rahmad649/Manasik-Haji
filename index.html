<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>Materi Manasik Haji</title>
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: { emerald: '#0f5132', forest: '#14532d', moss: '#1b6e44' } }, fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } } }
  </script>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #e2e8f0; }
    .app-wrapper { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 28rem; height: 100%; display: flex; flex-direction: column; background-color: #f8fafc; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
    .header-area { flex-shrink: 0; z-index: 50; background-color: #f8fafc; }
    .content-area { flex-grow: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 1rem 1rem 3rem 1rem; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    
    .swal2-popup { border-radius: 1.5rem !important; font-family: "Plus Jakarta Sans", sans-serif; padding: 1.5rem !important; }
    .swal2-title { font-size: 1.25rem !important; color: #1e293b !important; padding-top: 0 !important; }
    .custom-input { width: 100%; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 0.75rem 1rem; font-size: 0.875rem; outline: none; transition: all 0.2s; }
    .custom-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
    .custom-file-input::file-selector-button { margin-right: 1rem; padding: 0.5rem 1rem; border-radius: 9999px; border: none; font-size: 0.875rem; font-weight: 600; background-color: #eff6ff; color: #1d4ed8; cursor: pointer; transition: all 0.2s; }
    .custom-file-input::file-selector-button:hover { background-color: #dbeafe; }
  </style>
</head>
<body class="font-sans text-slate-800 antialiased selection:bg-emerald-200">
  
  <div class="app-wrapper">
    <div class="app-container">
      
      <!-- AREA HEADER -->
      <div class="header-area shadow-sm">
        <header class="relative bg-slate-100 text-slate-900 pt-3.5 pb-3.5 px-4 rounded-b-[1.25rem] shadow-sm">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3.5">
              <div class="flex-shrink-0 h-11 w-auto flex items-center justify-center">
                <img src="https://drive.google.com/thumbnail?id=17KxZoH3JrRh49B7AiQY3EfsfAHShYElT" alt="Logo KBIHU" class="h-10 w-auto object-contain">
              </div>
              <div class="flex flex-col justify-center">
                <h1 class="text-base font-bold text-slate-900 leading-tight tracking-wide">
                  Materi <span class="font-extrabold text-[#0f5132]">Manasik Haji</span>
                </h1>
                <p class="text-[11px] text-slate-600 font-semibold tracking-tight mt-0.5">Tahun 1448 H / 2027 M</p>
              </div>
            </div>
            
            <button onclick="showAddModal()" class="w-9 h-9 bg-gradient-to-br from-amber-500 to-[#0f5132] text-white rounded-full flex items-center justify-center hover:scale-105 shadow-md transition-all focus:outline-none">
              <i class="fa-solid fa-plus text-sm"></i>
            </button>
            
          </div>
        </header>

        <section class="px-4 mt-3">
          <div class="p-1 bg-slate-200/80 rounded-xl flex items-center text-xs font-semibold shadow-inner max-w-sm mx-auto">
            <button onclick="setCategory('Video')" id="tab-Video" class="flex-1 py-2 px-3 rounded-lg bg-white text-[#0f5132] shadow-sm flex items-center justify-center space-x-1.5 transition-all font-bold">
              <i class="fa-solid fa-play-circle text-sm"></i><span>Video Materi</span>
            </button>
            <button onclick="setCategory('Foto')" id="tab-Foto" class="flex-1 py-2 px-3 rounded-lg text-slate-500 hover:text-slate-800 flex items-center justify-center space-x-1.5 transition-all bg-transparent shadow-none font-semibold">
              <i class="fa-regular fa-image text-sm"></i><span>Galeri Foto</span>
            </button>
          </div>
        </section>

        <div class="flex items-center justify-between px-4 mt-3 pb-2 pt-1 bg-slate-50">
          <div class="flex items-center space-x-2">
            <div class="w-1 h-5 bg-[#0f5132] rounded-full"></div>
            <!-- TEKS JUDUL DINAMIS -->
            <h2 id="katalog-title" class="text-base font-extrabold text-slate-900 tracking-tight">Katalog Materi</h2>
          </div>
          <span id="videoCount" class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-bold bg-emerald-100 text-[#0f5132] border border-emerald-200 shadow-sm">Memuat...</span>
        </div>
      </div>

      <!-- AREA KONTEN -->
      <main class="content-area space-y-5">
        <div id="loading" class="flex justify-center items-center py-12"><div class="animate-spin rounded-full h-10 w-10 border-t-4 border-b-4 border-[#0f5132]"></div></div>
        <div id="videoContainer" class="flex flex-col gap-5 hidden"></div>
      </main>
    </div>
  </div>

  <script>
    let allVideos = [];
    let activeCategory = 'Video'; 
    const CACHE_KEY = 'kbihu_materi_data';

    // PASTIKAN API_URL INI BENAR
    const API_URL = "https://script.google.com/macros/s/AKfycbwdILFBt9-j3tdGr7eL7EOoQNaqMdmbDwzCB8EAKfQBJArgpHmsqg4I-5KUmsBTtqPKCQ/exec";

    window.onload = function() {
      const cachedData = localStorage.getItem(CACHE_KEY);
      if (cachedData) {
        try {
          const parsed = JSON.parse(cachedData);
          if (parsed && parsed.length > 0) displayVideos(parsed);
        } catch(e) {}
      }

      fetch(API_URL)
        .then(response => response.json())
        .then(data => {
          if (data.error) throw new Error(data.error);
          localStorage.setItem(CACHE_KEY, JSON.stringify(data));
          if (!cachedData) displayVideos(data);
          else { allVideos = data; renderCards(allVideos); }
        })
        .catch(error => { if (!cachedData) showError(error); });
    };

    function displayVideos(videos) {
      allVideos = videos;
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('videoContainer').classList.remove('hidden');
      renderCards(allVideos);
    }

    function renderCards(videos) {
      const container = document.getElementById('videoContainer');
      container.innerHTML = '';
      const filtered = videos.filter(item => item.kategori && item.kategori.toLowerCase() === activeCategory.toLowerCase());
      document.getElementById('videoCount').innerText = filtered.length + " " + activeCategory;

      if (filtered.length === 0) {
        container.innerHTML = '<div class="text-center py-10"><p class="text-slate-500 text-sm font-medium">Data belum tersedia.</p></div>';
        return;
      }

      filtered.forEach(item => {
        const isFoto = (activeCategory === 'Foto');
        const thumb = item.url_thumbnail || (item.id_media ? `https://drive.google.com/thumbnail?id=${item.id_media}&sz=w800` : `https://via.placeholder.com/640x360.png?text=Media+Tersedia`);
        const btnText = isFoto ? 'Lihat Foto' : 'Tonton Video';
        const btnIcon = isFoto ? 'fa-image' : 'fa-play';
        const pemateriHtml = !isFoto ? `<div class="flex items-center gap-2"><i class="fa-solid fa-chalkboard-user text-[#0f5132] w-4 text-center"></i><span class="font-semibold text-slate-800">Pemateri:</span> <span class="truncate">${item.pemateri}</span></div>` : '';
        
        const titleIcon = isFoto ? 'fa-images text-amber-500' : 'fa-circle-play text-[#0f5132]';

        const card = document.createElement('article');
        card.className = 'bg-white rounded-2xl overflow-hidden border border-slate-200/90 shadow-lg hover:shadow-xl transition-shadow duration-300';
        
        card.innerHTML = `
          <div class="relative w-full aspect-video bg-slate-900 overflow-hidden group cursor-pointer" onclick="playMedia('${item.id_media}')">
            <img alt="Thumbnail" class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500 ease-out" src="${thumb}"/>
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/40 via-transparent to-transparent pointer-events-none"></div>
          </div>
          <div class="p-4 space-y-3.5">
            <div>
              <div class="flex items-start gap-2.5">
                <i class="fa-solid ${titleIcon} mt-1 text-sm shrink-0"></i>
                <h3 class="text-[17px] font-bold text-slate-900 leading-snug tracking-tight">${item.judul}</h3>
              </div>
              <p class="text-[13px] text-slate-500 mt-1.5 leading-relaxed line-clamp-2 cursor-pointer hover:text-slate-700 transition-colors duration-300" onclick="this.classList.toggle('line-clamp-2')" title="Klik teks untuk membaca selengkapnya">
                ${item.deskripsi}
              </p>
            </div>
            
            <div class="bg-slate-50 rounded-xl p-3 border border-slate-100 space-y-2 text-[12px] text-slate-600">
              ${pemateriHtml}
              <div class="flex items-center gap-2"><i class="fa-regular fa-calendar-days text-[#0f5132] w-4 text-center"></i><span class="font-semibold text-slate-800">Waktu:</span> <span>${item.tanggal}</span></div>
              <div class="flex items-center gap-2"><i class="fa-solid fa-location-dot text-[#0f5132] w-4 text-center"></i><span class="font-semibold text-slate-800">Lokasi:</span> <span>${item.lokasi}</span></div>
            </div>
            
            <div class="pt-1">
              <button class="w-full py-3 px-4 bg-gradient-to-r from-amber-500 to-[#0f5132] text-white font-bold rounded-xl text-sm flex items-center justify-center space-x-2 shadow-md" onclick="playMedia('${item.id_media}')">
                <i class="fa-solid ${btnIcon} text-sm"></i><span>${btnText}</span>
              </button>
            </div>
          </div>`;
        container.appendChild(card);
      });
    }

    function setCategory(categoryName) {
      activeCategory = categoryName;
      const tV = document.getElementById('tab-Video'), tF = document.getElementById('tab-Foto');
      const title = document.getElementById('katalog-title');
      
      if (categoryName === 'Video') {
        title.innerText = 'Katalog Materi';
        tV.className = 'flex-1 py-2 px-3 rounded-lg bg-white text-[#0f5132] shadow-sm flex items-center justify-center space-x-1.5 font-bold';
        tF.className = 'flex-1 py-2 px-3 rounded-lg text-slate-500 flex items-center justify-center space-x-1.5 font-semibold bg-transparent';
      } else {
        title.innerText = 'Katalog Foto';
        tF.className = 'flex-1 py-2 px-3 rounded-lg bg-white text-[#0f5132] shadow-sm flex items-center justify-center space-x-1.5 font-bold';
        tV.className = 'flex-1 py-2 px-3 rounded-lg text-slate-500 flex items-center justify-center space-x-1.5 font-semibold bg-transparent';
      }
      renderCards(allVideos); 
    }

    function playMedia(id) { window.open('https://drive.google.com/open?id=' + id, '_blank'); }

    function showError(error) {
      document.getElementById('loading').classList.add('hidden');
      Swal.fire({ icon: 'error', title: 'Terjadi Kesalahan', text: 'Periksa koneksi Anda.', confirmButtonColor: '#0f5132', customClass: { popup: 'rounded-2xl' } });
    }

    function showAddModal() {
      const isVideo = activeCategory === 'Video';
      const acceptType = isVideo ? 'video/*,image/*' : 'image/*';
      
      Swal.fire({
        title: `<span class="font-extrabold text-slate-800 tracking-tight">Upload ${activeCategory}</span>`,
        html: `
          <div class="text-left space-y-3 mt-4 font-sans">
            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">File ${activeCategory}</label>
              <input type="file" id="swal-file" accept="${acceptType}" capture="environment" class="custom-input custom-file-input text-slate-500">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Judul Materi</label>
              <input id="swal-judul" class="custom-input" placeholder="Masukkan judul materi...">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Deskripsi Singkat</label>
              <textarea id="swal-deskripsi" class="custom-input" placeholder="Tuliskan keterangan..." rows="2"></textarea>
            </div>
            ${isVideo ? `
            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Pemateri / Ustadz</label>
              <input id="swal-pemateri" class="custom-input" placeholder="Nama Pemateri">
            </div>` : ''}
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Tanggal</label>
                <input id="swal-tanggal" class="custom-input" placeholder="Cth: 13 Sep 2026">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Lokasi</label>
                <input id="swal-lokasi" class="custom-input" placeholder="Gresik">
              </div>
            </div>
          </div>
        `,
        showCancelButton: true,
        confirmButtonText: '<i class="fa-solid fa-cloud-arrow-up mr-2"></i>Upload File',
        cancelButtonText: 'Batal',
        buttonsStyling: false,
        customClass: { 
          confirmButton: 'bg-gradient-to-r from-amber-500 to-[#0f5132] text-white rounded-xl font-bold px-5 py-2.5 shadow-md hover:shadow-lg mr-3 focus:outline-none', 
          cancelButton: 'bg-slate-200 text-slate-700 hover:bg-slate-300 rounded-xl font-bold px-5 py-2.5 transition-colors focus:outline-none' 
        },
        preConfirm: () => {
          const judul = document.getElementById('swal-judul').value.trim();
          const fileInput = document.getElementById('swal-file');
          
          if (!judul || fileInput.files.length === 0) {
            Swal.showValidationMessage('File dan Judul wajib diisi!');
            return false;
          }
          
          const file = fileInput.files[0];
          
          return new Promise((resolve) => {
            if (activeCategory === 'Foto' && file.type.startsWith('image/')) {
              const reader = new FileReader();
              reader.readAsDataURL(file);
              reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                  const canvas = document.createElement('canvas');
                  const MAX_SIZE = 1200; 
                  let width = img.width, height = img.height;
                  
                  if (width > height && width > MAX_SIZE) {
                    height *= MAX_SIZE / width; width = MAX_SIZE;
                  } else if (height > MAX_SIZE) {
                    width *= MAX_SIZE / height; height = MAX_SIZE;
                  }
                  
                  canvas.width = width; canvas.height = height;
                  const ctx = canvas.getContext('2d');
                  ctx.drawImage(img, 0, 0, width, height);
                  
                  const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                  
                  resolve({
                    kategori: activeCategory, judul: judul, deskripsi: document.getElementById('swal-deskripsi').value.trim(),
                    pemateri: '', tanggal: document.getElementById('swal-tanggal').value.trim(), lokasi: document.getElementById('swal-lokasi').value.trim(),
                    fileBase64: compressedBase64, fileName: file.name, mimeType: 'image/jpeg'
                  });
                };
              };
            } else {
              const reader = new FileReader();
              reader.onload = function(e) {
                resolve({
                  kategori: activeCategory, judul: judul, deskripsi: document.getElementById('swal-deskripsi').value.trim(),
                  pemateri: isVideo ? document.getElementById('swal-pemateri').value.trim() : '',
                  tanggal: document.getElementById('swal-tanggal').value.trim(), lokasi: document.getElementById('swal-lokasi').value.trim(),
                  fileBase64: e.target.result.split(',')[1], fileName: file.name, mimeType: file.type
                });
              };
              reader.readAsDataURL(file);
            }
          });
        }
      }).then((result) => {
        if (result.isConfirmed) uploadDataToGoogle(result.value);
      });
    }

    function uploadDataToGoogle(data) {
      Swal.fire({ 
        title: 'Sedang Mengunggah...', 
        html: '<span class="text-sm text-slate-500">Menyimpan file ke database, harap tunggu sebentar.</span>', 
        allowOutsideClick: false, 
        didOpen: () => { Swal.showLoading(); } 
      });

      const params = new URLSearchParams();
      params.append('kategori', data.kategori);
      params.append('judul', data.judul);
      params.append('deskripsi', data.deskripsi);
      params.append('pemateri', data.pemateri);
      params.append('tanggal', data.tanggal);
      params.append('lokasi', data.lokasi);
      params.append('fileBase64', data.fileBase64);
      params.append('fileName', data.fileName);
      params.append('mimeType', data.mimeType);

      fetch(API_URL, {
        method: 'POST',
        body: params
      })
      .then(response => response.json())
      .then(res => {
        if (res.status === 'success') {
          localStorage.removeItem(CACHE_KEY); 
          Swal.fire({ 
            icon: 'success', 
            title: 'Berhasil!', 
            text: 'File tersimpan di Google Drive.', 
            confirmButtonColor: '#0f5132', 
            customClass: { popup: 'rounded-[1.5rem]' } 
          }).then(() => window.location.reload());
        } else throw new Error(res.message);
      })
      .catch(error => {
        Swal.fire({ 
          icon: 'error', 
          title: 'Upload Gagal', 
          text: error.message || 'Gagal mengirim file. Coba dengan file yang lebih kecil.', 
          confirmButtonColor: '#0f5132', 
          customClass: { popup: 'rounded-[1.5rem]' } 
        });
      });
    }
  </script>
</body>
</html>
